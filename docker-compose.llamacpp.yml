# llama.cpp's llama-server, serving a Qwen2.5-Instruct GGUF variant pulled
# directly via llama.cpp's own `-hf <repo>:<quant>` downloader. Separate
# compose file from docker-compose.yml (different image/entrypoint/cache
# volume/port than the vLLM service, not a variant of the same service).
#
# Image tag confirmed live on this device, 2026-09-04 - see
# src/llm_coordinator.py's _DEFAULT_LLAMACPP_IMAGE comment for the full
# story (the bare "r36.4.0" tag exists but its old llama.cpp build
# hard-errors on tool_choice; this newer tag works despite its
# cu128/24.04 label not matching this device's actual CUDA 12.6/Ubuntu
# 22.04 base). Keep this file and that constant in sync by hand.
#
# --jinja: required for OpenAI-style tool_calls to come back structured -
# without it the model can still emit tool-call-shaped text but
# llama-server won't parse it into message.tool_calls, silently breaking
# scripts/validate_tool_calling.py's scoring.
services:
  llamacpp:
    image: dustynv/llama_cpp:0.3.9-r36.4.0-cu128-24.04
    runtime: nvidia
    network_mode: host
    ipc: host
    volumes:
      - /opt/llama-cache:/root/.cache/llama.cpp  # separate from vLLM's HF_HOME cache - see llm_coordinator.py
    environment:
      - LLAMA_CACHE=/root/.cache/llama.cpp
    entrypoint: ["llama-server"]
    command:
      - -hf
      - ${MODEL:-Qwen/Qwen2.5-1.5B-Instruct-GGUF}:${QUANT:-Q4_K_M}
      - --host
      - "0.0.0.0"
      - --port
      - "8090"  # not llama.cpp's conventional 8080 - already bound by embedded-ai-chain's
                # live dashboard on this device, see llm_coordinator.py's port comment
      - -ngl
      - ${N_GPU_LAYERS:--1}
      - -c
      - ${CTX_SIZE:-4096}
      - --jinja
