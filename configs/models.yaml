# Registry of orchestrator-LLM candidates to benchmark, keyed by the
# --model-config value scripts/*.py accept. `backend`, `platform`, and
# `precision` are required fields (see docs/promotion-contract.md §2) - every
# row must say which serving backend and which physical machine it targets,
# since the tuning fields below (gpu_memory_utilization vs n_gpu_layers) are
# only meaningful relative to both.
#
# vllm rows: gpu_memory_utilization/max_model_len are LOAD-BEARING on
# platform: orin - do not default to vLLM's own 0.9 (see
# embedded-ai-chain/docs/environment.md - this device has ~30GB unified
# memory, not isolated discrete-GPU VRAM). The three orin/vllm values below
# are copied from embedded-ai-chain/src/orchestrator_models.py's own
# already-tuned thresholds, not re-derived - see that file's docstring for
# the full reasoning (the 1.5b default's fixed 0.08 caused a real
# "No available memory for the cache blocks" flake on 2026-09-03; these
# values already account for that).
#
# llama-cpp rows: `quant` selects which file llama.cpp's own `-hf <repo>:
# <quant>` downloader pulls from the model repo; `n_gpu_layers=-1` offloads
# every layer to GPU (llama.cpp's own "all layers" sentinel); `ctx_size` is
# llama.cpp's analogue of max_model_len. None of the llama-cpp rows are
# benchmarked yet - this backend is new to this lab (jetson-vlm-lab never
# used it), so every value here is a starting point, not a measured result.
#
# thor rows: not yet added. Add them the same way jetson-vlm-lab added its
# own `-thor` rows (see that repo's configs/models.yaml) once real access to
# the Thor is wired up here (docs/TODO.md Phase 2) - gpu_memory_utilization/
# n_gpu_layers left unconfirmed until a real run against Thor's own free
# memory happens; do not guess a number here ahead of that.

# --- fp16 precision arm, added 2026-09-09 -----------------------------------
# Why these exist: every Orin row in this file is quantized (AWQ int4 or GGUF
# Q4_K_M) and every Thor row on the thor-edge-llm branch is fp16 - so the
# Orin-vs-Thor BFCL `irrelevance` gap (1.5B vLLM: 36.7% here vs 68% there)
# has precision and hardware varying together and cannot be attributed to
# either. These rows hold hardware, backend, image, model family and sample
# fixed and vary ONLY precision, which is the one comparison the
# cross-platform data structurally cannot make.
#
# This matters beyond methodology: embedded-ai-chain ships the AWQ int4 row,
# and its documented production failure is over-escalation - exactly what
# `irrelevance` measures. If int4 is implicated, that is directly actionable.
#
# gpu_memory_utilization is scaled from the AWQ rows by the weight-size ratio
# (fp16 is ~4x int4) plus KV/activation headroom, NOT copied from the Thor
# rows - Thor sets 0.25 of 122GB, which is ~30GB, i.e. this entire board.

1.5b-fp16-vllm-orin:
  model: Qwen/Qwen2.5-1.5B-Instruct
  precision: "fp16 (no quantization)"
  backend: vllm
  platform: orin
  gpu_memory_utilization: 0.30  # ~9GB of 30GB: ~3.1GB weights + KV/activation headroom
  max_model_len: 2048  # matches 1.5b-awq-vllm-orin exactly, so precision is the only delta
  notes: >
    Untested starting point, added 2026-09-09 as the fp16 control for
    1.5b-awq-vllm-orin. Weights are not cached on this board yet (~3.1GB
    download on first start). The decisive comparison of the pair: does
    AWQ int4 account for this row's AWQ twin scoring 36.7% BFCL irrelevance
    where the same model/backend at fp16 scored 68% on Thor?

3b-fp16-vllm-orin:
  model: Qwen/Qwen2.5-3B-Instruct
  precision: "fp16 (no quantization)"
  backend: vllm
  platform: orin
  gpu_memory_utilization: 0.45  # ~13.5GB of 30GB: ~6.2GB weights + KV/activation headroom
  max_model_len: 2048
  notes: >
    Untested starting point, added 2026-09-09 as the fp16 control for
    3b-awq-vllm-orin (~6.2GB download on first start). Second point on the
    precision axis - one pair could be coincidence.

7b-fp16-vllm-orin:
  model: Qwen/Qwen2.5-7B-Instruct
  precision: "fp16 (no quantization)"
  backend: vllm
  platform: orin
  gpu_memory_utilization: 0.75  # ~22.5GB of 30GB: ~15.2GB weights leaves ~7GB for KV
  max_model_len: 2048
  notes: >
    Untested and the highest-risk row in this file, added 2026-09-09
    (~15.2GB download on first start). 15.2GB of fp16 weights on a ~30GB
    board leaves a thin margin, and this may simply not fit even standalone -
    if it OOMs, that is a real result to record (docs/note.md 54), not a
    reason to retune until it passes. Directly comparable to Thor's
    7b-fp16-vllm-thor, which had 122GB to work with.

1.5b-awq-vllm-orin:
  model: Qwen/Qwen2.5-1.5B-Instruct-AWQ
  precision: "AWQ int4 (weights), bf16 activations"
  backend: vllm
  platform: orin
  gpu_memory_utilization: 0.15
  max_model_len: 2048  # matches the real production container exactly - confirmed live
                        # via `docker inspect vllm-orchestrator`, 2026-09-04 (an earlier
                        # version of this row guessed 4096, which orchestrator_models.py
                        # never actually specifies - fixed to the real value before this
                        # row's "known-good" claim was trusted for the Phase 1 smoke test)
  notes: >
    Currently what embedded-ai-chain actually ships as its orchestrator LLM
    default (orchestrator_models.py DEFAULT) - the known-good baseline every
    other row here is measured against. Documented weakness (see
    orchestrator_models.py / orchestrator.py's _FORCE_ASK_VLM): "auto"
    tool_choice unreliably escalates to ask_vlm at this size - this is the
    gap scripts/validate_tool_calling.py exists to quantify.

3b-awq-vllm-orin:
  model: Qwen/Qwen2.5-3B-Instruct-AWQ
  precision: "AWQ int4 (weights), bf16 activations"
  backend: vllm
  platform: orin
  gpu_memory_utilization: 0.25
  max_model_len: 4096
  notes: >
    Untested starting point (orchestrator_models.py's own "3b" option,
    never benchmarked there either) - thresholds inherited from that file,
    not re-derived. Re-tune if it fails to start or leaves too little KV
    cache.

7b-awq-vllm-orin:
  model: Qwen/Qwen2.5-7B-Instruct-AWQ
  precision: "AWQ int4 (weights), bf16 activations"
  backend: vllm
  platform: orin
  gpu_memory_utilization: 0.5
  max_model_len: 4096
  notes: >
    Untested, high-risk starting point (orchestrator_models.py's own "7b"
    option) - same rough scale as the VLM this project already struggled to
    fit resident alongside YOLO/pose/STT. Benchmark standalone first (no
    other pipeline components running) before drawing any co-residency
    conclusion from it.

bielik-11b-awq-vllm-orin:
  model: speakleash/Bielik-11B-v3.0-Instruct-awq
  precision: "compressed-tensors int4, group_size=128, symmetric=false (NOT classic AWQ despite the repo name - see note)"
  backend: vllm
  platform: orin
  gpu_memory_utilization: 0.3  # untested starting point - between the 3b (0.25) and 7b (0.5)
                                # rows' fractions since this quant's ~6.2GB weights fall between
                                # those two sizes; re-tune on first real run, same as every other
                                # untested row here
  max_model_len: 2048  # matches every other row's for a fair cross-family comparison
  notes: >
    EXCLUDED from active experimentation (Phase 5 onward), 2026-09-07 decision -
    tool-calling is confirmed broken on two parsers (see below), which is the
    axis this lab's scorecard cares about most; the working llama.cpp sibling
    row (bielik-11b-q4-llamacpp-orin) carries this family forward instead. Row
    and conclusion kept per this file's append-only convention (§2 above,
    docs/promotion-contract.md) - this is exclusion from future campaigns, not
    erasure of the finding. Still benchmarkable for raw performance (serves
    correctly) if a future phase wants a non-tool-calling comparison point; just
    not carried into the tool-calling scorecard. See docs/TODO.md's decision
    log for the exclusion decision itself.

    Smoke-tested 2026-09-04. gpu_memory_utilization=0.3 works (cold start
    ~234-274s across two runs) - no re-tuning needed. Official SpeakLeash
    repo (219K downloads - more than their own GGUF), confirmed ungated
    (unlike the base speakleash/Bielik-11B-v3.0-Instruct repo). Named "-awq"
    by SpeakLeash but its own config.json shows "quant_method":
    "compressed-tensors" (int4, group_size=128, packed via the llmcompressor
    project's format) - a different quantization path than the classic AWQ
    used for the Qwen rows above; vLLM auto-detected and loaded it fine, no
    extra_args needed. Plain completion and a Polish-language sanity check
    ("Jaka jest stolica Polski?" -> correct, coherent Polish) both work well.

    Tool-calling: CONFIRMED NOT WORKING via vLLM, on two different
    parsers - --tool-call-parser hermes (vLLM's compiled-in default for this
    lab's VllmCoordinator) and llama3_json (tried since Bielik-v3 is
    LlamaForCausalLM-architected) both returned an empty tool_calls list on
    the identical get_weather/Warsaw test that vLLM+Qwen2.5 and
    llama.cpp+Bielik both handled correctly. Not a fluke - two independent
    parsers, identical result. Root cause, not just symptom: Bielik's own
    GGUF README documents tool use only as a manual prompt-injection
    convention (an Ollama Modfile asking the model to emit
    {"name":...,"arguments":{...}} as plain text), not evidence of native
    training on any tagged format vLLM's per-family regex parsers look for -
    consistent with why llama.cpp's grammar-CONSTRAINED "Generic" tool-call
    path works for this model (forces valid JSON structurally, regardless of
    what the model was trained to emit) where vLLM's tag-DETECTION parsers
    don't (nothing to detect if the model never emits the tag at all). Not
    exhaustively tried: vLLM has ~30 total --tool-call-parser options: the
    other ~28 remain untried after two failed, cheap, plausible guesses -
    diminishing-returns territory, not attempted further without a specific
    reason to expect a particular one would match Bielik's training.

# --- Thor platform rows (vllm backend only) ---
# Added 2026-09-08: the user cloned this repo directly onto Thor and runs
# Claude Code there too, so Phase 6 (docs/TODO.md) started for real instead
# of staying blocked on hardware access. Two real, Thor-specific findings
# from that session drive every field below that differs from these rows'
# -orin twins:
#   1. Thor already runs a production container, `vllm-vlm-thor` (confirmed
#      via `docker ps`), serving Qwen2.5-VL-7B-Instruct-AWQ on port 8000
#      using image `ghcr.io/nvidia-ai-iot/vllm:latest-jetson-thor` - a
#      DIFFERENT image tag than this repo's own `_DEFAULT_VLLM_IMAGE`/
#      `docker-compose.yml` (`-jetson-orin`), and using the same port
#      `VllmCoordinator` defaults to. Every row below sets `port: 8001` and
#      `image` explicitly - both fields pass straight through to
#      VllmCoordinator via build_coordinator()'s **local_kwargs (see
#      src/llm_coordinator.py), no code change needed.
#   2. `free -h` on Thor: 122GiB total unified memory vs Orin's ~30GB (>4x) -
#      gpu_memory_utilization fractions below are NOT copied from the -orin
#      rows, they're independent conservative starting points sized to fit
#      *alongside* vllm-vlm-thor's own already-resident 0.3 share of this
#      same pool. Untested (no real run against Thor yet) - re-tune per
#      Phase 1's own convention (guess conservative, tighten after a real
#      run), same rule this file already applies to every orin row.
# --- Thor's third backend: TensorRT Edge-LLM (Thor-only, no Orin counterpart) ---
# Added 2026-09-08 after a real serve. Edge-LLM is not a container backend like
# the other two: it is built from source on-device (~/dev/TensorRT-Edge-LLM,
# release 0.10.1, its own venv) and launched with `tensorrt-edgellm-serve`,
# which speaks the same OpenAI-compatible wire format vLLM and llama.cpp do -
# so `RemoteCoordinator` against 127.0.0.1 already drives it with ZERO repo
# code changes, which is how this row was first measured. `backend: edge-llm`
# is therefore currently descriptive only: build_coordinator() branches on it
# for --target local, and no local EdgeLlmCoordinator exists yet (see
# docs/TODO.md Phase 6a - it would be a near-copy of VllmCoordinator, since
# the serve CLI has the same --enable-auto-tool-choice/--tool-call-parser
# flags). Until it does, run this row with:
#   --target remote --remote-host 127.0.0.1 --remote-port 8002
# and remember benchmark.py correctly refuses to report cold_start_ms for a
# remote target - so this row cannot produce a cold-start number until that
# coordinator exists. Port 8002 keeps clear of BOTH port 8000 (the box's
# production vllm-vlm-thor) and 8001 (this file's own -thor vllm rows).
#
# WHY FP16 AND NOT AWQ, i.e. why this row cannot mirror 1.5b-awq-vllm-orin
# exactly: Qwen2.5-1.5B-Instruct-AWQ FAILS to build here. Edge-LLM's server
# always goes through its experimental direct (checkpoint->engine, no ONNX)
# builder with externalized weights, and that path raises "external FP16 bias
# has no checkpoint recipe" for int4_awq on a qwen2 graph - Qwen2-family
# models have attention QKV biases (Qwen3 dropped them) and this corner has no
# recipe. Confirmed 2026-09-08, upstream limitation, not a config error here.
# So the Edge-LLM leg varies precision against the orin rows; it holds the
# model constant instead. Say so in any cross-platform comparison that uses it.
# The size sweep Orin cannot run. Every -orin row is memory-constrained on a
# ~30GB pool; Thor's 122GB is the whole reason to ask whether a BIGGER model
# closes the `irrelevance` gap (knowing when NOT to call a tool) that
# 1.5b-fp16-edgellm-thor still shows at 78%. Framework is held constant at the
# one that won the 1.5B comparison, so size is the only variable.
# Qwen2.5-7B-Instruct is in Edge-LLM's supported-models list; FP16 for the
# same reason every other Thor row is FP16 (its builder cannot do this
# family's AWQ - see the block below).
7b-fp16-vllm-thor:
  model: Qwen/Qwen2.5-7B-Instruct
  precision: "fp16 (no quantization)"
  backend: vllm
  platform: thor
  port: 8001
  image: ghcr.io/nvidia-ai-iot/vllm:latest-jetson-thor
  gpu_memory_utilization: 0.25  # ~30GB of Thor's 122GB: ~15.2GB weights + KV headroom
  max_model_len: 2048
  extra_volumes:  # see VllmCoordinator's own `extra_volumes` comment - without this,
    # vLLM's startup memory profiling asserts and dies on this board whenever free
    # memory ticks UP mid-profile, which it does even on a completely idle Thor at
    # 7B. Mounts embedded-ai-chain's already-deployed patch (the box's own production
    # container has used it since 2026-08-04). Startup profiling only; touches no
    # inference path, so it cannot flatter a latency or throughput number.
    - /opt/hf-cache/gpu_worker_patched.py:/opt/venv/lib/python3.12/site-packages/vllm/v1/worker/gpu_worker.py:ro
  notes: >
    Added 2026-09-08 for the 7B leg of the framework comparison - the open
    question being whether Edge-LLM's tool-call lead at 1.5B survives at a size
    where capacity alone fixes most of the irrelevance gap.

7b-fp16-llamacpp-thor:
  model: Qwen/Qwen2.5-7B-Instruct-GGUF
  precision: "GGUF fp16 (unquantized, to match the other 7B legs)"
  backend: llama-cpp
  platform: thor
  quant: fp16  # 4 split files (qwen2.5-7b-instruct-fp16-0000{1..4}-of-00004.gguf),
               # confirmed present via HF API 2026-09-08; llama.cpp's -hf
               # downloader handles split GGUFs itself.
  image: ghcr.io/nvidia-ai-iot/llama_cpp:b10373-r38.2.arm64-sbsa-cp312-cu130-24.04
  n_gpu_layers: -1
  ctx_size: 2048
  notes: >
    Added 2026-09-08 for the 7B leg of the framework comparison.

# The largest candidate this lab has ever tried, and one the Orin could not
# host at all. ~28GB of FP16 weights: it does NOT fit alongside the box's
# production container (~37GB of the 122GB pool), so this row is exclusively a
# quiet-box run - see scripts/thor_exclusive_window.sh Phase 4.
# --- Parser-parity controls, added 2026-09-09 ---
# The framework comparison's headline (Edge-LLM judges tool calls best) carries
# one confound: the backends did not use the same tool-call parser. Edge-LLM ran
# `auto` (its own model-native detection) while vLLM ran `hermes`, this repo's
# compiled-in default since the Orin rows. `hermes` exists in BOTH backends'
# parser lists, so pinning it on Edge-LLM too is the experiment that separates
# "Edge-LLM's runtime judges better" from "Edge-LLM's default parser is better
# configured". These rows are identical to their -thor twins in every other
# field - only tool_call_parser differs, which is the point.
1.5b-fp16-edgellm-thor-hermes:
  model: Qwen/Qwen2.5-1.5B-Instruct
  precision: "fp16 (no quantization)"
  backend: edge-llm
  platform: thor
  port: 8002
  max_input_len: 2048
  tool_call_parser: hermes  # the ONLY difference from 1.5b-fp16-edgellm-thor
  notes: >
    Parser-parity control for 1.5b-fp16-edgellm-thor (which scored 83% overall
    / 78% irrelevance with `auto`). Shares that row's engine cache bundle -
    the parser is a serving-time flag, not a build parameter, so this costs no
    rebuild.

7b-fp16-edgellm-thor-hermes:
  model: Qwen/Qwen2.5-7B-Instruct
  precision: "fp16 (no quantization)"
  backend: edge-llm
  platform: thor
  port: 8002
  max_input_len: 2048
  tool_call_parser: hermes  # the ONLY difference from 7b-fp16-edgellm-thor
  notes: >
    Parser-parity control for 7b-fp16-edgellm-thor (93% overall / 94%
    irrelevance with `auto`) - the row the recommendation actually rests on,
    and the one vLLM's own hermes run (73% / 54%) is being compared against.

# --- Quantization sweep on Edge-LLM, added 2026-09-09 ---
# Every Edge-LLM row so far is FP16 because the ONLY quant path tried
# (Qwen2.5-*-Instruct-AWQ, classic AutoAWQ format) hit a real build bug
# (external FP16 bias has no checkpoint recipe). Edge-LLM's builder actually
# supports six quant_types (fp16, fp8, fp8_block, mxfp8, nvfp4, int4_awq,
# int4_awq_modelopt, int4_gptq, int8_sq per quantization.py's QUANT_TYPES) -
# AWQ failing does not mean int4 itself is unsupported for this architecture.
# This row tests Qwen's OWN official GPTQ-Int4 checkpoint (ungated, confirmed
# live 2026-09-09) - a different int4 code path (int4_gptq, not int4_awq) on
# the identical Qwen2ForCausalLM architecture whose QKV bias broke AWQ. If
# this builds, it is the "best of both worlds" candidate this lab has been
# missing: 7B's accuracy at closer to 1.5B's latency/energy. NOT yet
# confirmed to build - this is exactly the kind of claim Phase 0's "device
# enumeration is not a smoke test" lesson says to verify, not assume.
# FP8 test: does Edge-LLM's fp8_linear path share int4_linear's bias bug?
# fp8_linear/mxfp8_linear call _add_bias() WITHOUT passing name/recipe at all
# (see int4_gptq's own note above for why that is a worse sign, not a better
# one) - genuinely unknown until tested, not assumed either way.
7b-fp8-edgellm-thor:
  model: RedHatAI/Qwen2.5-7B-Instruct-FP8-dynamic
  precision: "FP8 dynamic (compressed-tensors format, llmcompressor) - ungated, confirmed live 2026-09-09"
  backend: edge-llm
  platform: thor
  port: 8002
  max_input_len: 2048
  notes: >
    INCONCLUSIVE, confirmed 2026-09-09 - fails, but NOT with the bias bug and
    NOT informative about whether fp8_linear would hit it. Real error:
    "unsupported compressed-tensors checkpoint format: float-quantized" -
    Edge-LLM's compressed-tensors parser (quantization.py) only accepts that
    quant_method when its format string contains "nvfp4"; this checkpoint's
    llmcompressor-produced "float-quantized" FP8-dynamic format is rejected
    before any layer is built, let alone the attention bias. A DIFFERENT,
    NVIDIA-ModelOpt-authored checkpoint (embedding `quant_algo` rather than
    `quant_method: compressed-tensors`) would take a different code path and
    might not hit either failure - but no official/trustworthy ModelOpt-FP8
    or NVFP4 checkpoint exists for base Qwen2.5-7B-Instruct as of 2026-09-09
    (only VL variants: nvidia/Qwen2.5-VL-7B-Instruct-FP8/NVFP4; the text-model
    hits found are unofficial community quants, which does not meet this lab's
    provenance bar - see Apertus/Bielik's own GGUF sourcing for that standard).
    Not pursued further on that basis, not because the code path is assumed
    broken.

# A THIRD checkpoint at the "same" quant_method, tried after the first two,
# and it reveals a routing bug rather than testing int8 at all - see this
# row's own notes for why Qwen's official GPTQ-Int8 repo does NOT exercise
# Edge-LLM's real int8 path.
# --- SELF-QUANTIZED rows, 2026-09-09 ---
# Every published quantized checkpoint tried for this model was either blocked
# by Edge-LLM's int4 bias bug (AWQ, GPTQ-Int4, GPTQ-Int8-misrouted) or in a
# format its parser rejects (llmcompressor FP8-dynamic: "float-quantized" is
# not accepted, and it carries no static input_scale, which Edge-LLM's FP8
# loader requires unconditionally). The way out was NOT to hunt for a better
# checkpoint - it was to MAKE one, with Edge-LLM's own bundled quantizer
# (`tensorrt-edgellm-quantize`, ModelOpt-based), which by construction emits
# exactly the `quant_algo` config and static scales the builder expects.
#
# Produced on-device from the plain FP16 Qwen2.5-7B-Instruct checkpoint, run
# inside nvcr.io/nvidia/pytorch:25.12-py3 (the host has no torch, and Jetson
# torch wheels are fragile to install; that container already ships a
# platform-correct torch 2.10+cu13 for Thor). Calibration: cnn_dailymail,
# 128 samples (the tool's default is 512 - reduced for a first pass; re-run
# larger if a row is promoted). See patches/README.md for the two Edge-LLM
# bugs that had to be cleared first, and note the container ships modelopt
# 0.39 whose quant_cfg is a dict, while this code needs 0.45's list form -
# install nvidia-modelopt==0.45.0 --no-deps into a --system-site-packages
# venv so the container's own torch is left alone.
7b-int8sq-selfquant-edgellm-thor:
  model: /home/michal/dev/quantize-work/qwen2.5-7b-int8_sq
  served_model_name: qwen2.5-7b-int8_sq  # Edge-LLM registers a local checkpoint
    # DIRECTORY under its basename, not the path it was launched with - without
    # this every request 404s. See EdgeLlmCoordinator's served_model_name comment.
  precision: "INT8 SmoothQuant per-channel (W8A8_SQ_PER_CHANNEL), self-quantized via ModelOpt, cnn_dailymail/128"
  backend: edge-llm
  platform: thor
  port: 8002
  max_input_len: 2048
  notes: >
    WORKING, 2026-09-09 - this lab's first INT8 row on any backend, and only
    possible because the checkpoint was made rather than downloaded: its
    config carries `quant_algo: W8A8_SQ_PER_CHANNEL`, which is the exact
    string quantization.py matches to reach QUANT_INT8_SQ (`if "W8A8" in
    algorithm`). No published Qwen2.5-7B checkpoint uses that format. 8.2GB
    vs FP16's 15GB. Engine built, server up, plain completion correct
    ("Warsaw"), and unforced tool_choice="auto" returned a correctly
    structured get_weather({"city":"Warsaw"}) on 5/5 repeated attempts.
    (One earlier probe appeared to fail; that was a test artifact - it used a
    terser tool description, so the model judged differently. Not a
    reliability defect.) Full BFCL/MMLU pending.

7b-fp8-selfquant-edgellm-thor:
  model: /home/michal/dev/quantize-work/qwen2.5-7b-fp8
  served_model_name: qwen2.5-7b-fp8  # see the int8 row above
  precision: "FP8 static per-tensor + FP8 KV cache, self-quantized via ModelOpt, cnn_dailymail/128"
  backend: edge-llm
  platform: thor
  port: 8002
  max_input_len: 2048
  notes: >
    Quantized 2026-09-09 (`quant_algo: FP8`, `dynamic: false` - STATIC, with
    calibrated input scales, which is precisely what the rejected llmcompressor
    FP8-dynamic checkpoint lacked). Also carries fp8 kv_cache_quantization and
    exported calibrated Q-BMM scales for all 28 attention layers. 8.2GB.
    NOTE the quantizer's own warning during calibration: "Large KV activations
    detected. Quantized KV cache may lead to higher accuracy drop" - so if this
    row underperforms on BFCL/MMLU relative to the INT8 row, re-run it WITHOUT
    --kv_cache_quantization fp8 before concluding FP8 weights are the problem.
    Build/serve and full BFCL/MMLU pending.

# --- Remediation rows for the damaged first self-quant attempt, 2026-09-09 ---
# The first pair came back broken (INT8: MMLU 67.5%->44.5%; FP8: 0/50 tool
# calls, so its "100% irrelevance" is an artifact of never calling anything,
# not judgment). INT4-GPTQ being essentially lossless while INT8/FP8 were not
# is backwards from theory and points at this lab's own quantization, so these
# two rows change exactly one variable each.
