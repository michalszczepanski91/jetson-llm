                                 # ~3.1GB, the rest is KV cache headroom
  max_model_len: 2048  # matches the edge-llm row's --max-input-len
  extra_volumes:  # see VllmCoordinator's own `extra_volumes` comment - without this,
    # vLLM's startup memory profiling asserts and dies on this board whenever free
    # memory ticks UP mid-profile, which it does even on a completely idle Thor at
