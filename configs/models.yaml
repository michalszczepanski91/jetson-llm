7b-gptq-int8-edgellm-thor:
  model: Qwen/Qwen2.5-7B-Instruct-GPTQ-Int8
  precision: "GPTQ int8, group_size=128, symmetric, exllama v1 (Qwen's own official quant, bits=8)"
  backend: edge-llm
  platform: thor
  port: 8002
  max_input_len: 2048
  notes: >
    BLOCKED, confirmed 2026-09-09, but by a ROUTING bug, not a real int8 test.
    quantization.py's `method == "gptq"` branch (core/quantization.py:154)
    unconditionally returns quant_type=int4_gptq - it never reads this
    checkpoint's own `bits: 8` field. So this "Int8" checkpoint gets force-fed
    through the SAME int4 unpacking path as 7b-gptq-edgellm-thor, and dies at
    the identical line for the identical reason (backend.py:1179 _add_bias,
    "external FP16 bias has no checkpoint recipe"). This result says nothing
    new about int8 - it is a 4th confirmation of the same attention-bias bug
    (AWQ, GPTQ-Int4, GPTQ-Int8 all hit it identically) plus a separate,
    genuine bits-mismatch bug in how Edge-LLM 0.10.1 detects GPTQ precision.
    Edge-LLM's REAL int8 path (int8_sq) only activates via a `quant_algo`
    field containing "W8A8" or "INT8" (ModelOpt-style config, NOT plain HF
    `quant_method: gptq`) - no official checkpoint in that format exists for
    base Qwen2.5-7B-Instruct as of 2026-09-09, same provenance gap as the
    FP8/NVFP4 row above.

7b-gptq-edgellm-thor:
  model: Qwen/Qwen2.5-7B-Instruct-GPTQ-Int4
  precision: "GPTQ int4, group_size=128, symmetric, exllama v1 (Qwen's own official quant)"
  backend: edge-llm
  platform: thor
  port: 8002
  max_input_len: 2048
  notes: >
    UNBLOCKED, 2026-09-09 - root cause found and fixed. Traced the
    "external FP16 bias has no checkpoint recipe" failure to its actual
    source: weights.py's linear_metadata(), int4 branch (AWQ/AWQ_MODELOPT/
    GPTQ all share one return statement) computes `bias_recipe` correctly
    a few lines earlier (identically to the FP16 branch, which DOES use it)
    but simply OMITS `bias_recipe=bias_recipe` from the LinearWeights(...) it
    returns - a one-line omission in Edge-LLM 0.10.1's own source, not a
    checkpoint-format or provenance issue. Confirmed by patching that one
    line locally (~/dev/TensorRT-Edge-LLM, not upstreamed) and re-running
    this exact checkpoint: engine built, `Engine loaded and ready`, and both
    smoke tests passed - plain completion coherent ("Four" for 2+2), and an
    UNFORCED tool_choice="auto" call correctly returned
    get_weather({"city":"Warsaw"}) with finish_reason="tool_calls". This is
    now this lab's first working quantized Edge-LLM row - the "best of both
    worlds" candidate (7B judgment at lower memory/bandwidth than FP16) is
    real, not theoretical. Same one-line fix should also unblock int4_awq
    and int4_awq_modelopt (identical return statement) - not yet re-verified
    per format, only GPTQ has been re-tested end to end. Full BFCL/MMLU/
    timing comparison against 7b-fp16-edgellm-thor is the next step, not yet
    run.

