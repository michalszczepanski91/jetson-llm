# --- llama.cpp on Thor: a DIFFERENT image family than the Orin rows ---
# `dustynv/llama_cpp` (what every -orin llama-cpp row above uses) publishes no
# r38/Thor tag at all, only r35.x/r36.x - checked live against Docker Hub's
# tag list, 2026-09-08, and Thor is L4T R38.4.0 / JetPack 7.1. So the Orin
# image does not transfer. Upstream's own `ghcr.io/ggml-org/llama.cpp:
# server-cuda` does publish a linux/arm64 manifest, and - the part that was
# genuinely uncertain - DOES see this board's iGPU (`--list-devices` reports
# "CUDA0: NVIDIA Thor (125771 MiB)") and loads the model, but then dies on the
# FIRST inference request with "CUDA error: an internal operation failed" in
# cublas_handle. Enumeration-compatible with Tegra, not runtime-compatible.
# So this row uses NVIDIA's own Thor build from GHCR instead. Note two traps
# in that repo: `dustynv/llama_cpp` on Docker Hub has no r38 tag at all
# (jetson-containers publishes r38-era images to GHCR under nvidia-ai-iot/),
# and GHCR's own rolling `r38.2.arm64-sbsa-cu130-24.04` tag ships an Apr-2025
# llama-server linked against CUDA 12 inside a CUDA-13 image, which dies at
# startup with "libcudart.so.12: cannot open shared object file". The dated
# b-numbered tag below is the one that actually runs. Unlike ggml-org's image
# it sets no ENTRYPOINT, so `server_argv0` keeps its "llama-server" default.
1.5b-fp16-llamacpp-thor:
  model: Qwen/Qwen2.5-1.5B-Instruct-GGUF
  precision: "GGUF fp16 (NOT a k-quant - deliberately unquantized to match the other two Thor legs)"
  backend: llama-cpp
  platform: thor
  quant: fp16  # the repo's own qwen2.5-1.5b-instruct-fp16.gguf, confirmed present
               # via HF API 2026-09-08. Every -orin llama-cpp row uses Q4_K_M
               # instead; this row is fp16 ONLY so the Thor framework comparison
               # holds precision constant - Edge-LLM cannot build the AWQ/int4
               # checkpoint at all, so fp16 is the one precision all three
               # backends here share.
  image: ghcr.io/nvidia-ai-iot/llama_cpp:b10373-r38.2.arm64-sbsa-cp312-cu130-24.04
  n_gpu_layers: -1
  ctx_size: 2048  # matches both other Thor legs
  notes: >
    Added 2026-09-08 as the llama.cpp leg of Thor's framework comparison.
    Port stays LlamaCppCoordinator's 8090 default - free on this box (8000 is
    the production vllm-vlm-thor, 8001 this file's vllm -thor rows, 8002 the
    edge-llm row).
1.5b-awq-vllm-thor:
  model: Qwen/Qwen2.5-1.5B-Instruct-AWQ
  precision: "AWQ int4 (weights), bf16 activations"
  backend: vllm
  platform: thor
  port: 8001  # NOT 8000 - vllm-vlm-thor already binds it, see comment block above
  image: ghcr.io/nvidia-ai-iot/vllm:latest-jetson-thor
  gpu_memory_utilization: 0.05  # ~6.1GB of Thor's 122GB. Deliberately kept at the
                                 # original conservative value rather than raised now
                                 # that the box is exclusive: it is already MORE
                                 # absolute memory than the Orin twin gets (0.15 of
                                 # ~30GB = ~4.5GB) for the identical checkpoint, and
                                 # max_model_len caps real KV use identically on both.
                                 # Raising it would buy nothing and weaken the P5
                                 # comparison.
  max_model_len: 2048  # matches 1.5b-awq-vllm-orin for a fair P5 cross-platform comparison
  extra_volumes:  # same startup memory-profiling patch every other vLLM Thor row
    # needs - see 7b-fp16-vllm-thor's comment for the full story. Added here
    # pre-emptively rather than after a failure: it touches startup profiling only,
    # never the inference path, so it cannot flatter a latency or throughput number.
    - /opt/hf-cache/gpu_worker_patched.py:/opt/venv/lib/python3.12/site-packages/vllm/v1/worker/gpu_worker.py:ro
  notes: >
    Thor counterpart of 1.5b-awq-vllm-orin - the same checkpoint, precision,
    backend and max_model_len, so the pair is this lab's cleanest available
    answer to paper.md's P5 ("does the ranking change with the hardware?").
    Row added 2026-09-08; first actually run 2026-09-10, and deliberately
    through scripts/run_experiment.py rather than the shell scripts the rest
    of the Thor campaign used, so it is also the first Thor result to carry a
    real experiment_id, manifest and execution_condition (docs/TODO.md
    Phase 6's measurement-integrity gap).

# The cross-BACKEND control row on Thor. Everything else about a framework
# comparison is noise unless the model and precision are pinned, and Edge-LLM
# forced the choice: it cannot build Qwen2.5's AWQ checkpoint at all (see the
# 1.5b-fp16-edgellm-thor block below), so FP16 Qwen2.5-1.5B-Instruct is the
# ONLY variant all candidate backends on this box can serve. That makes this
# row - not 1.5b-awq-vllm-thor - the one to compare against Edge-LLM and
# llama.cpp. It is deliberately NOT the same precision as
# 1.5b-awq-vllm-orin, so do not read it as the Orin baseline's Thor twin.
1.5b-fp16-vllm-thor:
  model: Qwen/Qwen2.5-1.5B-Instruct
  precision: "fp16 (no quantization - matches 1.5b-fp16-edgellm-thor exactly, for the framework comparison)"
