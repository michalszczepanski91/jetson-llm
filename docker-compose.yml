# vLLM Jetson container serving a Qwen2.5-Instruct-AWQ variant. Parameterized
# by env vars (see Makefile's `serve-*` targets) rather than a fixed
# model/config pair, so this one file covers every vllm-backend row in
# configs/models.yaml. Copied from jetson-vlm-lab's docker-compose.yml -
# nothing here was VLM-specific (no image/multimodal flags), only the
# default MODEL differs.
#
# --gpu-memory-utilization: THIS VALUE IS LOAD-BEARING, DO NOT DEFAULT TO
# VLLM'S OWN 0.9 - this device has ~30GB unified memory, not isolated
# discrete-GPU VRAM; 0.9 fails outright at startup on this hardware.
services:
  vllm:
    image: ghcr.io/nvidia-ai-iot/vllm:latest-jetson-orin  # vLLM 0.19.0+cu126 confirmed working (jetson-vlm-lab)
    runtime: nvidia
    network_mode: host
    ipc: host
    volumes:
      - /opt/hf-cache:/root/.cache/huggingface  # shared HF cache convention across third_party/jetson-* repos
    environment:
      - HF_HOME=/root/.cache/huggingface
      # HF_HOME alone does NOT redirect this image's downloads: it bakes in
      # HUGGINGFACE_HUB_CACHE=/data/models/huggingface, which wins. Without
      # these two the volume above is inert and every run re-downloads its
      # weights into the container. Confirmed live 2026-09-04 - see
      # src/llm_coordinator.py's VllmCoordinator.start() for the full story.
      # Keep the two in sync: a drift between this file and that one has
      # already cost this lab a debugging session once (docs/TODO.md Phase 1,
      # --enable-auto-tool-choice was in compose but not in the coordinator).
      - HUGGINGFACE_HUB_CACHE=/root/.cache/huggingface/hub
      - HF_HUB_CACHE=/root/.cache/huggingface/hub
    entrypoint: ["/opt/venv/bin/vllm"]
    command:
      - serve
      - ${MODEL:-Qwen/Qwen2.5-1.5B-Instruct-AWQ}
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --gpu-memory-utilization
      - ${GPU_MEMORY_UTILIZATION:-0.15}
      - --max-model-len
      - ${MAX_MODEL_LEN:-4096}
      - --trust-remote-code
      - --enable-auto-tool-choice
      - --tool-call-parser
      - hermes
